name: daily
on:
  schedule:
    - cron: "10 22 * * *"  # 23:10 / 00:10 Paris : le run calcule la date à Paris
    - cron: "10 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python mm.py site
        env:
          MM_BIRTH: ${{ secrets.MM_BIRTH }}
      - run: cp chrome/newtab.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
      # GitHub coupe les crons après 60 jours sans activité : un commit quotidien l'empêche
      - run: |
          date -u +%F > .alive
          git config user.name points-bot && git config user.email bot@users.noreply.github.com
          git add .alive && git commit -m alive && git push
