<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nouvel onglet</title>
<style>
  @font-face { font-family: Scoutie; src: url(https://augustinmarso.github.io/points/ScoutieSans-Regular.ttf); }
  html, body { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden;
               font-family: Scoutie, system-ui, sans-serif; color: #ebe6dc; }
  .bg { position: fixed; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.5s ease; }
  .bg.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .bg { transition: none; } }
  form { position: relative; margin: 6vh auto 0; width: min(560px, 90vw); }
  input[name=q] { width: 100%; box-sizing: border-box; padding: 14px 22px; border-radius: 999px; border: 0; outline: 0;
          font: 16px system-ui, sans-serif; color: #eee; background: rgba(0,0,0,.45); backdrop-filter: blur(8px); }
  #tab { position: fixed; right: 18px; bottom: 18px; width: 34px; height: 34px; border-radius: 50%; border: 0;
         cursor: pointer; background: rgba(255,255,255,.12); color: #ddd; font: 16px system-ui; opacity: .5; }
  #tab:hover, #tab:focus-visible { opacity: 1; }
  #info { position: fixed; pointer-events: none; padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.6;
          background: rgba(0,0,0,.7); backdrop-filter: blur(6px); opacity: 0; transition: opacity .2s; white-space: nowrap;
          font-variant-numeric: tabular-nums; }
  #info.show, #info.pin { opacity: 1; }
  #info small { opacity: .6; font-size: 11px; }
  /* photo de la semaine (copie locale du fond d'écran seulement) : noir et blanc, basse définition */
  #ph { display: block; width: 220px; margin-bottom: 8px; border-radius: 4px; filter: grayscale(1); image-rendering: auto; }
  #ph[hidden] { display: none; }
  #info.pin { pointer-events: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  /* juste sous le pourcentage de l'image (au-dessus de la barre des tâches) */
  #chrono { position: fixed; left: 0; right: 0; top: 81.5vh; text-align: center; font-size: 10px; letter-spacing: .04em;
            opacity: .45; font-variant-numeric: tabular-nums; }
  @media (orientation: portrait) { #chrono { top: auto; bottom: 10px; } }
  /* citation du moment : carte qui se retourne au clic (auteur + thème au dos) */
  #carte { position: fixed; left: 50%; top: 8vh; width: min(600px, 80vw); height: 7.5em; transform: translateX(-50%);
           perspective: 900px; cursor: pointer; font-size: 15px; background: none; border: 0; padding: 0; color: inherit; font-family: inherit; }
  form ~ #carte { top: 15vh; }
  #carte .in { position: relative; width: 100%; height: 100%; transition: transform .7s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
  #carte.dos .in { transform: rotateY(180deg); }
  #carte .face { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 22px; border-radius: 12px;
                 backface-visibility: hidden; background: rgba(255,255,255,.035); text-align: center; line-height: 1.5; }
  #carte .recto { font-style: italic; opacity: .82; }
  #carte .verso { transform: rotateY(180deg); }
  #carte .verso b { display: block; font-size: 18px; font-weight: 400; letter-spacing: .02em; }
  #carte .verso span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }
  #carte[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { #carte .in { transition: none; } }
  input[type=date] { font: inherit; color: inherit; background: transparent; border: 1px solid #555; border-radius: 6px; padding: 2px 6px; }
</style>
<div class="bg"></div><div class="bg"></div>
<form action="https://www.google.com/search">
  <input name="q" aria-label="Rechercher sur Google" autofocus autocomplete="off">
</form>
<button id="carte" hidden aria-label="Retourner la citation"><div class="in">
  <div class="face recto"></div><div class="face verso"><div><b></b><span></span></div></div>
</div></button>
<div id="info"><img id="ph" alt="" hidden><div id="txt"></div></div>
<div id="chrono" aria-hidden="true"></div>
<button id="tab" aria-label="Afficher ou masquer le tableau">◐</button>
<script>
  const base = "https://augustinmarso.github.io/points/";
  const fmt = innerWidth > innerHeight ? "desktop" : "phone";
  const day = new Date().toLocaleDateString("sv");  // ?d= change chaque jour : contourne le cache
  const layers = document.querySelectorAll(".bg");
  let plain = true, ids = [], k = 0, front = 0, timer;  // fond noir par défaut
  try { plain = localStorage.getItem("tableau") !== "1"; } catch {}
  if ("MM_TABLEAU" in window) plain = !window.MM_TABLEAU;  // fond d'écran du PC : réglé par le raccourci « Tableau oui-non »

  function show(file) {
    const img = new Image();
    img.onload = () => {  // n'affiche qu'une fois chargée : pas de flash noir
      front ^= 1;
      layers[front].style.backgroundImage = `url(${img.src})`;
      layers[front].classList.add("on");
      layers[front ^ 1].classList.remove("on");
    };
    img.src = `${base}${file}?d=${day}`;
  }
  function next() { k = (k + 1) % ids.length; show(`${fmt}-${ids[k]}.jpg`); }
  function start() {
    clearInterval(timer);
    if (plain || !ids.length) return show(`${fmt}.jpg`);
    show(`${fmt}-${ids[k]}.jpg`);
    timer = setInterval(next, 20000);
  }
  document.getElementById("tab").onclick = () => {
    plain = !plain;
    try { localStorage.setItem("tableau", plain ? "0" : "1"); } catch {}
    start();
  };
  fetch(`${base}carousel.json?d=${day}`).then(r => r.json()).then(c => {
    ids = c.ids || [];
    k = Math.floor(Date.now() / 86400000) % (ids.length || 1);  // départ différent chaque jour
  }).catch(() => {}).finally(start);

  // --- âge, part restante et compte à rebours : la date de naissance reste dans ce navigateur seulement ---
  const YEARS = 80;
  const info = document.getElementById("info"), chrono = document.getElementById("chrono");
  const txt = document.getElementById("txt"), ph = document.getElementById("ph");
  const local = "MM_BIRTH" in window;  // copie locale du fond d'écran Lively : config.js et photos.js chargés à côté
  const photos = new Set(window.MM_PHOTOS || []);
  let birth = null;
  // date : #AAAA-MM-JJ dans le lien (jamais envoyé au serveur), config.js local, ou ce navigateur
  const hashDate = /^#(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
  try { const s = hashDate ? hashDate[1] : window.MM_BIRTH || localStorage.getItem("naissance"); if (s) birth = new Date(s + "T00:00"); } catch {}
  if (local || new URLSearchParams(location.search).has("fond"))  // mode fond d'écran : ni recherche ni bouton
    document.querySelectorAll("form, #tab").forEach(e => e.remove());

  const addYears = (d, n) => { const r = new Date(d); r.setFullYear(r.getFullYear() + n); return r; };
  function span(from, to) {  // → [années pleines, jours, ms restantes dans le jour]
    let y = 0;
    while (addYears(from, y + 1) <= to) y++;
    const rest = to - addYears(from, y);
    return [y, Math.floor(rest / 86400000), rest % 86400000];
  }
  const fr = (x, d) => x.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
  const pad = (x, n = 2) => String(x).padStart(n, "0");

  function askBirth() {
    info.classList.add("pin");
    ph.hidden = true;
    txt.innerHTML = `Date de naissance <input type="date" aria-label="Date de naissance">`;
    txt.querySelector("input").onchange = e => {
      try { localStorage.setItem("naissance", e.target.value); } catch {}
      birth = new Date(e.target.value + "T00:00");
      info.classList.remove("pin");
    };
  }
  // --- quel point est sous la souris : même géométrie que mm.py, lue dans layout.json ---
  let layout = null, hover = null;  // hover = { wk } sur un point, { wk: null } sur la grille, null ailleurs
  fetch(`${base}layout.json?d=${day}`).then(r => r.json()).then(l => layout = l).catch(() => {});

  function pointAt(x, y) {
    const L = layout && layout[fmt];
    if (!L) return null;
    const sc = Math.max(innerWidth / L.W, innerHeight / L.H);  // background-size: cover
    const ix = (x - (innerWidth - L.W * sc) / 2) / sc, iy = (y - (innerHeight - L.H * sc) / 2) / sc;
    const [gc, gr] = L.grid, g = layout.gap;
    const s = Math.min(L.W * L.fw / (gc * 52 + (gc - 1) * g), L.H * L.fh / (gr * 10 + (gr - 1) * g));
    const bw = 52 * s, bh = 10 * s, gap = g * s;
    const ox = (L.W - (gc * bw + (gc - 1) * gap)) / 2;
    const oy = L.H * L.top + (L.H * (1 - L.top) - (gr * bh + (gr - 1) * gap)) / 2;
    const rx = ix - ox, ry = iy - oy;
    if (rx < 0 || ry < 0 || rx > gc * bw + (gc - 1) * gap || ry > gr * bh + (gr - 1) * gap) return null;
    const jc = Math.floor(rx / (bw + gap)), jr = Math.floor(ry / (bh + gap));
    const bx = rx - jc * (bw + gap), by = ry - jr * (bh + gap);
    const decade = jr * gc + jc;
    if (bx > bw || by > bh || decade * 10 >= layout.years) return { wk: null };  // entre deux blocs
    return { wk: (decade * 10 + Math.floor(by / s)) * 52 + Math.min(Math.floor(bx / s), 51) };
  }
  const nowWeek = now => {  // comme counts() de mm.py : 52 semaines par an, la 52e absorbe 1 ou 2 jours
    const [y] = span(birth, now);
    return y * 52 + Math.min(Math.floor((now - addYears(birth, y)) / 604800000), 51);
  };
  const dfr = d => d.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
  const plural = (n, w) => `${n.toLocaleString("fr-FR")} ${w}${n > 1 ? "s" : ""}`;

  function weekText(wk, now) {
    const y = Math.floor(wk / 52), w = wk % 52, anniv = addYears(birth, y);
    const start = new Date(+anniv + w * 604800000);
    const end = w === 51 ? new Date(+addYears(birth, y + 1) - 86400000) : new Date(+start + 6 * 86400000);
    const d = wk - nowWeek(now);
    const when = d === 0 ? "cette semaine" : d < 0 ? `vécue · il y a ${plural(-d, "semaine")}` : `dans ${plural(d, "semaine")}`;
    return `${y} ans · semaine ${w + 1} sur 52<br><small>${dfr(start)} → ${dfr(end)}</small><br>${when}`;
  }

  document.addEventListener("mousemove", e => {
    if (info.classList.contains("pin")) return;
    hover = pointAt(e.clientX, e.clientY);
    info.classList.toggle("show", !!hover);
    info.style.left = Math.min(e.clientX + 16, innerWidth - info.offsetWidth - 8) + "px";
    info.style.top = Math.min(e.clientY + 16, innerHeight - info.offsetHeight - 8) + "px";
  });
  document.addEventListener("mouseleave", () => { hover = null; info.classList.remove("show"); });
  document.addEventListener("dblclick", e => { if (pointAt(e.clientX, e.clientY)) askBirth(); });  // changer la date

  function tick() {
    if (birth) {
      const now = new Date(), end = addYears(birth, YEARS);
      const [ay, ad] = span(birth, now);
      const left = Math.max(end - now, 0);
      const pctLeft = 100 * left / (end - birth);
      const [ry, rd, rms] = span(now, end);
      const h = Math.floor(rms / 3600000), m = Math.floor(rms / 60000) % 60, s = Math.floor(rms / 1000) % 60, ms = rms % 1000;
      if (!info.classList.contains("pin") && hover) {
        const general = `${ay} ans et ${ad} jours · ${fr(pctLeft, 6)} % restant`;
        txt.innerHTML = hover.wk == null || hover.wk >= YEARS * 52 ? general : `${weekText(hover.wk, now)}<br><small>${general}</small>`;
        const src = local && hover.wk != null && photos.has(hover.wk) ? `photos/${hover.wk}.jpg` : "";
        if (ph.dataset.src !== src) { ph.dataset.src = src; ph.hidden = !src; if (src) ph.src = src; }  // pas de rechargement à chaque tic
      }
      chrono.textContent = `${ry} a ${pad(rd, 3)} j ${pad(h)}:${pad(m)}:${pad(s)}.${pad(ms, 3)}`;
    }
  }
  // --- citation : nouvelle 3 fois par jour (0 h, 8 h, 16 h) ; même calcul que citations.py pour l'envoi dans Anki ---
  const carte = document.getElementById("carte");
  let citations = {}, creneau = -1;  // { debut: créneau de la 1re citation, liste }
  const creneauNow = () => {
    const d = new Date();
    const jour = Math.floor((d - d.getTimezoneOffset() * 60000) / 86400000);  // jour local depuis 1970
    return jour * 3 + Math.floor(d.getHours() / 8);
  };
  function citation() {
    const c = creneauNow();
    if (!citations.liste || c === creneau) return;
    creneau = c;
    const q = citations.liste[(((c - citations.debut) % citations.liste.length) + citations.liste.length) % citations.liste.length];
    carte.classList.remove("dos");
    carte.querySelector(".recto").textContent = `« ${q.c} »`;
    carte.querySelector(".verso b").textContent = q.a;
    carte.querySelector(".verso span").textContent = q.t;
    carte.title = q.s;
    carte.hidden = false;
  }
  carte.onclick = () => carte.classList.toggle("dos");
  fetch(`${base}citations.json?d=${day}`).then(r => r.json()).then(l => { citations = l; citation(); }).catch(() => {});
  setInterval(citation, 60000);

  if (!birth) askBirth();
  setInterval(tick, 50);
</script>
</html>
